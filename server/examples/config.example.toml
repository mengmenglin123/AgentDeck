# Example cc-connect style config for HuanHermes Phase-1 host.
# Copy and adapt on your server after installing cc-connect + CLI agents.
# Docs: https://github.com/chenhg5/cc-connect

# --- Bridge: App connects here ---
[bridge]
enabled = true
port = 9810
path = "/bridge/ws"
token = "change-me-bridge-token-min-32-chars!!"

# --- Management API: status / projects / sessions ---
[management]
enabled = true
port = 9820
token = "change-me-mgmt-token-min-32-chars!!!!"

# --- Project: Claude Code ---
[[projects]]
name = "claude-code"
# admin_from = ["huan:device:user"]  # optional privileged commands

[projects.agent]
type = "claudecode"

[projects.agent.options]
work_dir = "/home/you/projects/app"
mode = "default"   # do NOT use yolo on public networks

# Optional providers — prefer CLI login on server
# [[projects.agent.providers]]
# name = "anthropic"
# api_key = "sk-ant-..."

# Bridge platform is built-in when [bridge] enabled; IM platforms optional.
# [[projects.platforms]]
# type = "telegram"
# ...

# --- Project: Codex ---
[[projects]]
name = "codex"

[projects.agent]
type = "codex"

[projects.agent.options]
work_dir = "/home/you/projects/app"
mode = "suggest"

# --- Hermes (not first-class in upstream; placeholder for Phase-2 adapter) ---
# [[projects]]
# name = "hermes"
# [projects.agent]
# type = "hermes"   # requires custom plugin / adapter
