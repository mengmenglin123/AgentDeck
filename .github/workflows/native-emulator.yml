name: Native Android emulator UI test

# Real emulator (KVM on the x86_64 runner) driving the app against mock-host.
# Results (screenshots, junit, logcat) are force-pushed to branch native-ci-emulator-api<N>,
# because the sandbox can't download Actions artifacts or logs.
on:
  push:
    branches: [native-android]
    paths:
      - 'apps/android/**'
      - '.github/workflows/native-emulator.yml'
      - '.github/scripts/emulator-run.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
          - api: 34
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APKs
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Start mock-host
        run: |
          nohup python3 server/mock-host/mock_host.py > "$RUNNER_TEMP/mock-host.log" 2>&1 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/9820) 2>/dev/null && break; sleep 1; done

      - name: Emulator run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/emulator-run.sh

      - name: Publish results
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/emu-out"; mkdir -p "$OUT"
          D=/tmp/pub/api${{ matrix.api }}; mkdir -p "$D/shots"
          cp -r "$OUT"/* "$D"/ 2>/dev/null || true
          find apps/android/app/build/outputs -name '*.png' -exec cp {} "$D/shots/" \; 2>/dev/null || true
          find "$D/shots-device" -name '*.png' -exec cp {} "$D/shots/" \; 2>/dev/null || true
          rm -rf "$D/shots-device"
          find apps/android/app/build/outputs/androidTest-results -name '*.xml' -exec cp {} "$D/" \; 2>/dev/null || true
          cp "$RUNNER_TEMP/mock-host.log" "$D/" 2>/dev/null || true
          echo "sha=${GITHUB_SHA}" >> "$D/summary.txt"
          cd /tmp/pub
          git init -q && git checkout -q -b b
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "emulator api${{ matrix.api }} ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:native-ci-emulator-api${{ matrix.api }}

      - name: Judge
        shell: bash
        run: |
          cat "$RUNNER_TEMP/emu-out/summary.txt"
          grep -q "connected_rc=0" "$RUNNER_TEMP/emu-out/summary.txt"
          grep -q "release_alive=yes" "$RUNNER_TEMP/emu-out/summary.txt"
