name: Native Android emulator UI test

# Real emulator (KVM on the x86_64 runner) driving the app against mock-host.
# Results (screenshots, junit, logcat) are force-pushed to branch native-ci-emulator-api<N>,
# because the sandbox can't download Actions artifacts or logs.
# Runs on release tags and manual dispatch only, to save Actions minutes.
on:
  push:
    tags: ['native-v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  HH_SIGNING_PASSWORD: ${{ secrets.HH_SIGNING_PASSWORD }}

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
          - api: 34
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # The emulator's userdata partition needs ~7 GB; the stock runner has ~6 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY/go" || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Decode signing key
        env:
          HH_SIGNING_P12_B64: ${{ secrets.HH_SIGNING_P12_B64 }}
        run: |
          if [ -n "$HH_SIGNING_P12_B64" ]; then
            mkdir -p apps/android/signing
            echo "$HH_SIGNING_P12_B64" | base64 -d > apps/android/signing/huanhermes-prerelease.p12
          else
            echo "::warning::HH_SIGNING_P12_B64 not set, APK will be debug-signed"
          fi
      - name: Build APKs
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Start mock-host
        run: |
          HUAN_MOCK_GIT_WRITE=1 nohup python3 server/mock-host/mock_host.py > "$RUNNER_TEMP/mock-host.log" 2>&1 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/9820) 2>/dev/null && break; sleep 1; done
          pip install --quiet paramiko
          nohup python3 server/mock-host/mock_agent_env.py --ssh-port 2222 --llm-port 8799 > "$RUNNER_TEMP/mock-agent.log" 2>&1 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/8799) 2>/dev/null && break; sleep 1; done

      - name: Emulator run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 3000M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/emulator-run.sh

      - name: Publish results
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/emu-out"; mkdir -p "$OUT"
          D=/tmp/pub/api${{ matrix.api }}; mkdir -p "$D/shots"
          cp -r "$OUT"/* "$D"/ 2>/dev/null || true
          find apps/android/app/build/outputs -name '*.png' -exec cp {} "$D/shots/" \; 2>/dev/null || true
          find "$D/shots-device" -name '*.png' -exec cp {} "$D/shots/" \; 2>/dev/null || true
          rm -rf "$D/shots-device"
          find apps/android/app/build/outputs/androidTest-results -name '*.xml' -exec cp {} "$D/" \; 2>/dev/null || true
          cp "$RUNNER_TEMP/mock-host.log" "$RUNNER_TEMP/mock-agent.log" "$D/" 2>/dev/null || true
          echo "sha=${GITHUB_SHA}" >> "$D/summary.txt"
          cd /tmp/pub
          git init -q && git checkout -q -b b
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "emulator api${{ matrix.api }} ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:native-ci-emulator-api${{ matrix.api }}

      - name: Judge
        shell: bash
        run: |
          cat "$RUNNER_TEMP/emu-out/summary.txt"
          grep -q "connected_rc=0" "$RUNNER_TEMP/emu-out/summary.txt"
          grep -q "release_alive=yes" "$RUNNER_TEMP/emu-out/summary.txt"
