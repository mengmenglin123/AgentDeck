name: Prerelease APK

# 推送 `v<版本>-rc<N>` 标签（例如 v0.1.204-rc1）时，构建 Release APK 并作为
# 预发布（prerelease）附加到 **本私有仓库** 的 GitHub Release。
# 不会向公开的 huanhermes-companion 仓库发布任何内容（那仍由 build-apk.yml 在合并到 main 时负责）。
#
# 签名：自 0.1.205 起 release 构建使用仓库内固定的预发布签名
# (apps/mobile/android/app/signing/huanhermes-prerelease.p12)，后续版本可覆盖安装；
# 0.1.204 及更早的包是 CI 随机 debug 签名，升级到 0.1.205 需先卸载一次。

on:
  push:
    tags:
      - 'v*-rc*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prerelease tag to create/update (e.g. v0.1.204-rc1)'
        required: true

permissions:
  contents: write

jobs:
  prerelease-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Python gates
        run: ./scripts/check.sh

      - name: Flutter pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        working-directory: apps/mobile
        run: flutter test

      - name: Build APK (release, arm64)
        working-directory: apps/mobile
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename and checksum
        id: apk
        shell: bash
        run: |
          version="$(awk '/^version:/ {split($2, parts, "+"); print parts[1]}' apps/mobile/pubspec.yaml)"
          name="huanhermes-$version.apk"
          mkdir -p dist
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cat "dist/$name.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: huanhermes-${{ steps.apk.outputs.version }}-release-apk
          path: dist/*
          retention-days: 30

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          NAME: ${{ steps.apk.outputs.name }}
        shell: bash
        run: |
          notes="HuanHermes $VERSION 预发布（Android arm64，release 构建，固定预发布签名）。
          构建提交：${GITHUB_SHA}
          安装：下载 $NAME 后在手机上允许“安装未知来源应用”。0.1.205 起签名固定，可直接覆盖安装；从 0.1.204 及更早版本升级需先卸载一次。
          校验：见 $NAME.sha256。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$NAME" "dist/$NAME.sha256" --clobber
          else
            gh release create "$TAG" "dist/$NAME" "dist/$NAME.sha256" \
              --prerelease --target "$GITHUB_SHA" \
              --title "HuanHermes $VERSION ($TAG)" --notes "$notes"
          fi
